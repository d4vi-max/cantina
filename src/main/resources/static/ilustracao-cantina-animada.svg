<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="Alunos comprando lanche na cantina">
<style>
.steam{fill:none;stroke:#2A2731;stroke-opacity:.28;stroke-width:2;stroke-linecap:round;opacity:0;animation:steam 2.6s ease-in-out infinite}
.s2{animation-delay:.9s}.s3{animation-delay:1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.wave{transform-origin:258px 126px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out .6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.ticket{animation:tk 2.2s ease-in-out infinite}
@keyframes tk{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
.glow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.3}}
.scoop{transform-box:fill-box;transform-origin:center bottom;animation:hop 3s ease-in-out infinite}
.sc2{animation-delay:.15s}.sc3{animation-delay:.3s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam{opacity:0}}
</style>

