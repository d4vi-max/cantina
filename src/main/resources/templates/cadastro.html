<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro · Cantina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#B91C1C">
    <link rel="apple-touch-icon" th:href="@{/icon-192.png}">
</head>
<body>
<main class="screen">

    <header class="header">
        <div class="header-bar">
            <div class="header-row">
                <div class="logo">
                    <div class="logo-top">
                        <div class="scoops"><span></span><span></span><span></span></div>
                        <div class="logo-name">Cantina</div>
                    </div>
                    <div class="logo-sub">Américo Alves</div>
                </div>
            </div>
        </div>
        <div class="drips" aria-hidden="true">
            <i style="width:44px;height:22px;border-radius:0 0 22px 22px"></i>
            <i style="width:30px;height:40px;border-radius:0 0 15px 15px"></i>
            <i style="width:52px;height:16px;border-radius:0 0 26px 26px"></i>
            <i style="width:26px;height:54px;border-radius:0 0 13px 13px"></i>
            <i style="width:44px;height:26px;border-radius:0 0 22px 22px"></i>
            <i style="width:38px;height:18px;border-radius:0 0 19px 19px"></i>
            <i style="width:58px;height:34px;border-radius:0 0 29px 29px"></i>
            <i style="width:28px;height:62px;border-radius:0 0 14px 14px"></i>
            <i style="width:46px;height:20px;border-radius:0 0 23px 23px"></i>
            <i style="width:60px;height:38px;border-radius:0 0 30px 30px"></i>
            <div class="drop-track"><div class="drop"></div></div>
        </div>
    </header>

    <form th:action="@{/cadastro}" method="post">

        <section class="content">

            <div class="card erro" th:if="${erro}" th:text="${erro}"></div>

            <div class="card campos">
                <label>Nome completo</label>
                <input type="text" name="nome" required>

                <label>Seu RA</label>
                <input type="text" name="login" required>

                <label>Turma</label>
                <input type="text" name="turma" required placeholder="Ex.: 3B">

                <label>Ano de conclusão</label>
                <input type="number" name="anoConclusao" required min="2026" max="2031">

                <label>Crie uma senha</label>
                <input type="password" name="senha" required minlength="6">

                <button class="confirm" type="submit" style="margin-top:16px">Cadastrar</button>

                <p style="text-align:center;margin-top:16px">
                    <a th:href="@{/login}">Já tenho cadastro</a>
                </p>
            </div>
        </section>
    </form>

</main>
</body>
</html>
